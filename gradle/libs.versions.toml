[versions]
agp = "8.2.0"
kotlin = "1.9.22"
ksp = "1.9.22-1.0.17"
hilt = "2.50"
compose-bom = "2024.02.00"
room = "2.6.1"
lifecycle = "2.7.0"
navigation = "2.7.6"
coroutines = "1.7.3"
work = "2.9.0"
zxing = "3.5.2"
zxing-android = "4.3.0"
glide = "4.16.0"
maps = "18.2.0"
location = "21.1.0"
gson = "2.10.1"
core-ktx = "1.12.0"
activity-compose = "1.8.2"

[libraries]
androidx-core-ktx          = { group = "androidx.core",       name = "core-ktx",            version.ref = "core-ktx" }
androidx-activity-compose  = { group = "androidx.activity",   name = "activity-compose",     version.ref = "activity-compose" }
kotlinx-coroutines         = { group = "org.jetbrains.kotlinx",name = "kotlinx-coroutines-android", version.ref = "coroutines" }

# Compose BOM
androidx-compose-bom              = { group = "androidx.compose",          name = "compose-bom",            version.ref = "compose-bom" }
androidx-compose-ui               = { group = "androidx.compose.ui",       name = "ui" }
androidx-compose-ui-graphics      = { group = "androidx.compose.ui",       name = "ui-graphics" }
androidx-compose-ui-tooling       = { group = "androidx.compose.ui",       name = "ui-tooling" }
androidx-compose-ui-tooling-preview = { group = "androidx.compose.ui",     name = "ui-tooling-preview" }
androidx-compose-material3        = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons   = { group = "androidx.compose.material", name = "material-icons-extended" }

# Lifecycle
androidx-lifecycle-runtime-ktx      = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx",       version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose  = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose",   version.ref = "lifecycle" }

# Navigation
androidx-navigation-compose  = { group = "androidx.navigation", name = "navigation-compose",    version.ref = "navigation" }
hilt-navigation-compose      = { group = "androidx.hilt",       name = "hilt-navigation-compose", version = "1.1.0" }

# Room
androidx-room-runtime  = { group = "androidx.room", name = "room-runtime",  version.ref = "room" }
androidx-room-ktx      = { group = "androidx.room", name = "room-ktx",      version.ref = "room" }
androidx-room-compiler = { group = "androidx.room", name = "room-compiler",  version.ref = "room" }

# Hilt
hilt-android  = { group = "com.google.dagger", name = "hilt-android",          version.ref = "hilt" }
hilt-compiler = { group = "com.google.dagger", name = "hilt-android-compiler", version.ref = "hilt" }

# WorkManager
androidx-work-runtime = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
hilt-work             = { group = "androidx.hilt", name = "hilt-work",         version = "1.1.0" }
hilt-work-compiler    = { group = "androidx.hilt", name = "hilt-compiler",     version = "1.1.0" }

# QR
zxing-core    = { group = "com.google.zxing",       name = "core",                  version.ref = "zxing" }
zxing-android = { group = "com.journeyapps",         name = "zxing-android-embedded", version.ref = "zxing-android" }

# Maps & Location
play-services-maps     = { group = "com.google.android.gms", name = "play-services-maps",     version.ref = "maps" }
play-services-location = { group = "com.google.android.gms", name = "play-services-location", version.ref = "location" }

# Image & Utils
glide = { group = "com.github.bumptech.glide", name = "glide",   version.ref = "glide" }
gson  = { group = "com.google.code.gson",       name = "gson",    version.ref = "gson" }

[plugins]
android-application = { id = "com.android.application",        version.ref = "agp" }
kotlin-android      = { id = "org.jetbrains.kotlin.android",   version.ref = "kotlin" }
hilt                = { id = "com.google.dagger.hilt.android",  version.ref = "hilt" }
ksp                 = { id = "com.google.devtools.ksp",          version.ref = "ksp" }
